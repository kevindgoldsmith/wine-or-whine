<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Wine or Whine explainer</title>
<style>
@font-face { font-family: 'DM Serif Display'; src: url('../../web/node_modules/@fontsource/dm-serif-display/files/dm-serif-display-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'IBM Plex Mono'; src: url('../../web/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); font-weight: 500; }
@font-face { font-family: 'IBM Plex Mono'; src: url('../../web/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2') format('woff2'); font-weight: 600; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../../web/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../../web/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2') format('woff2'); font-weight: 600; }
@font-face { font-family: 'Caveat'; src: url('../../web/node_modules/@fontsource/caveat/files/caveat-latin-600-normal.woff2') format('woff2'); font-weight: 600; }
:root {
  --kraft: #e4d3b2; --kraft-dark: #d6c098; --paper: #fbf6ea; --paper-edge: #cdb894; --ink: #1f2a44; --ink-soft: #2c3a5c;
  --stamp: #b0302a; --vine: #2f5a3b; --vine-light: #3f6b4a; --tape: #f1e3a0; --muted: #6a6152; --rule: #cdbb98;
  --serif: 'DM Serif Display', Georgia, serif; --mono: 'IBM Plex Mono', monospace; --sans: 'IBM Plex Sans', sans-serif; --hand: 'Caveat', cursive;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--kraft); }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--ink); font-family: var(--sans);
  background: radial-gradient(ellipse at 30% 20%, #ead9b9 0%, var(--kraft) 55%, #dcc7a1 100%); }
#stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background:
  radial-gradient(circle, #b9a57c 2.5px, transparent 3px) 0 0 / 16px 14px, #d9c39a; opacity: 0.9; }
.scene { position: absolute; inset: 0; opacity: 0; }
.icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; }
.center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.row { display: flex; align-items: center; justify-content: center; gap: 24px; }

/* chapter tab and caption strip */
.chapter { position: absolute; left: 64px; top: 52px; opacity: 0; font-family: var(--mono); font-weight: 600; font-size: 22px; letter-spacing: 0.14em;
  text-transform: uppercase; background: var(--paper); padding: 10px 18px; border-radius: 4px; box-shadow: 0 2px 0 var(--paper-edge); }
.chapter b { color: var(--stamp); margin-right: 10px; }
.caption { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); opacity: 0; max-width: 1500px; width: max-content;
  background: var(--paper); color: var(--ink); font-size: 40px; font-weight: 600; line-height: 1.25; text-align: center; padding: 18px 34px 20px;
  border-radius: 4px; box-shadow: 0 3px 0 var(--paper-edge), 0 18px 34px rgba(60, 40, 10, 0.18); }
.caption::before { content: ""; position: absolute; left: 50%; top: -14px; width: 120px; height: 28px; margin-left: -60px; background: var(--tape); opacity: 0.85; transform: rotate(-2deg); }
.note { position: absolute; font-family: var(--mono); font-size: 22px; color: var(--muted); letter-spacing: 0.04em; opacity: 0; }

/* luggage tag */
.tag { position: relative; background: var(--paper); border-radius: 6px 14px 14px 6px; padding: 18px 20px 18px 56px; min-width: 190px;
  clip-path: polygon(22px 0, 100% 0, 100% 100%, 22px 100%, 0 calc(100% - 22px), 0 22px); box-shadow: inset 0 0 0 2px var(--rule); }
.tag::before { content: ""; position: absolute; left: 20px; top: 50%; width: 20px; height: 20px; margin-top: -10px; border-radius: 50%;
  background: var(--kraft); box-shadow: inset 0 0 0 4px #b8925a; }
.tag .nm { font-family: var(--serif); font-size: 38px; line-height: 1.05; display: block; }
.tag .st { white-space: nowrap; font-family: var(--mono); font-weight: 600; font-size: 17px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 6px; align-items: center; margin-top: 6px; }
.tag.dark { background: var(--ink); color: var(--paper); box-shadow: none; }
.tag.dark .st { color: var(--tape); }
.tag.grey { opacity: 0.55; }
.tag.over { box-shadow: inset 0 0 0 3px var(--stamp); }
.tag.over .st { color: var(--stamp); }
.tag.chill .st { color: var(--vine); }
.tag.big .nm { font-size: 56px; }
.tag.big { padding: 26px 30px 26px 66px; }

/* role tag */
.role { width: 420px; height: 470px; background: var(--paper); border-radius: 10px; padding: 34px 34px 30px 34px; position: relative;
  box-shadow: 0 4px 0 var(--paper-edge), 0 24px 40px rgba(60, 40, 10, 0.2); display: flex; flex-direction: column; gap: 14px; }
.role .hole { position: absolute; right: 30px; top: 30px; width: 30px; height: 30px; border-radius: 50%; background: var(--kraft); box-shadow: inset 0 0 0 5px #b8925a; }
.role .team { font-family: var(--mono); font-weight: 600; font-size: 20px; letter-spacing: 0.12em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
.role h3 { margin: 6px 0 0; font-family: var(--serif); font-weight: 400; font-size: 52px; line-height: 1.02; }
.role p { margin: 0; font-size: 26px; line-height: 1.3; color: var(--muted); }
.role .big-ic { font-size: 92px; margin-top: auto; }
.role .count { position: absolute; right: 26px; bottom: 26px; font-family: var(--mono); font-weight: 600; font-size: 34px; }
.role.chill .team, .role.chill .big-ic { color: var(--vine); }
.role.over .team, .role.over .big-ic, .role.chief .team, .role.chief .big-ic { color: var(--stamp); }
.role.chief { background: #fff8ec; box-shadow: inset 0 0 0 4px var(--stamp), 0 4px 0 var(--paper-edge), 0 24px 40px rgba(60, 40, 10, 0.2); }

/* stamps */
.stamp { display: inline-flex; align-items: center; gap: 10px; border: 6px solid currentColor; border-radius: 10px; padding: 4px 18px;
  font-family: var(--mono); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; font-size: 40px; white-space: nowrap; background: rgba(251, 246, 234, 0.5); }
.stamp.g { color: var(--vine-light); }
.stamp.r { color: var(--stamp); }
.stamp.n { color: var(--ink); }
.stamp.sm { font-size: 22px; border-width: 4px; padding: 2px 10px; border-radius: 7px; }

/* tickets (rails) */
.rail { display: grid; gap: 14px; }
.rail h4 { margin: 0; font-family: var(--mono); font-weight: 600; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase; display: flex; gap: 10px; align-items: center; }
.rail.B h4 { color: var(--vine); } .rail.O h4 { color: var(--stamp); }
.tickets { display: flex; gap: 16px; }
.ticket { position: relative; width: 150px; height: 190px; background: #efe2c6; border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 0 2px var(--rule);
  display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ticket .bd { position: absolute; left: 8%; top: 18%; width: 84%; height: 64%; opacity: 0.16; }
.ticket .bd svg { width: 100%; height: 100%; }
.rail.B .bd { color: var(--vine); } .rail.O .bd { color: var(--stamp); }
.ticket .no { position: absolute; left: 14px; bottom: 10px; font-family: var(--mono); font-size: 17px; color: var(--muted); }
.ticket .lbl { position: absolute; left: 14px; top: 12px; font-family: var(--sans); font-weight: 600; font-size: 20px; color: var(--stamp); }
.ticket .fill { position: absolute; inset: 0; background: var(--paper); opacity: 0; }
.ticket .stamp { position: relative; font-size: 20px; border-width: 4px; padding: 2px 8px; opacity: 0; }
.rail.O .ticket .stamp { font-size: 15px; padding: 2px 5px; }

/* phone frame */
.phone { width: 300px; height: 600px; border-radius: 44px; background: #181d2c; padding: 16px; box-shadow: 0 30px 60px rgba(40, 25, 5, 0.35); }
.phone .scr { width: 100%; height: 100%; border-radius: 38px; background: var(--kraft); position: relative; overflow: hidden; padding: 60px 16px 16px; }
.phone .scr::before { content: ""; position: absolute; top: 16px; left: 50%; width: 110px; height: 30px; margin-left: -55px; background: #181d2c; border-radius: 16px; }
.phone .who { position: absolute; top: -56px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
.chip { white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; font-family: var(--mono); font-weight: 600; font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase;
  background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 6px; }
.chip.paper { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 2px var(--rule); }
.chip.green { background: var(--vine); }
.chip.red { background: var(--stamp); }
.chip.tape { background: var(--tape); color: var(--ink); }
.hand { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; gap: 14px; }
.card { position: relative; height: 104px; border-radius: 12px; background: #fffdf8; box-shadow: inset 0 0 0 2px var(--rule); padding: 14px 16px; overflow: hidden; }
.card .k { font-family: var(--mono); font-size: 14px; letter-spacing: 0.14em; font-weight: 600; text-transform: uppercase; }
.card .t { font-family: var(--serif); font-size: 26px; line-height: 1.1; display: block; margin-top: 4px; }
.card.B .k, .card.B .t { color: var(--vine); } .card.O .k, .card.O .t { color: var(--stamp); }
.card .bd { position: absolute; right: 8px; top: 8px; bottom: 8px; width: 46%; opacity: 0.16; }
.card .bd svg { width: 100%; height: 100%; }
.card.B .bd { color: var(--vine); } .card.O .bd { color: var(--stamp); }
.card .stamp { position: absolute; right: 10px; bottom: 8px; font-size: 16px; border-width: 3px; padding: 1px 8px; opacity: 0; }

/* card slip (card moment) */
.slip { width: 620px; background: var(--paper); border-radius: 8px; box-shadow: 0 3px 0 var(--paper-edge), 0 30px 60px rgba(31, 42, 68, 0.35); text-align: center; padding-bottom: 28px; }
.slip .hd { background: var(--stamp); color: var(--paper); border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; padding: 12px 24px; font-family: var(--mono); font-weight: 600; font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase; }
.slip .stamp { margin: 34px 0 18px; font-size: 64px; transform: rotate(-4deg); }
.slip .ln { font-family: var(--hand); font-weight: 600; font-size: 54px; line-height: 1.1; }
.slip .sk { font-family: var(--mono); font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: 16px; }

.bubble { position: absolute; background: var(--paper); font-family: var(--hand); font-weight: 600; font-size: 46px; line-height: 1.05; padding: 14px 24px; border-radius: 18px;
  box-shadow: 0 4px 0 var(--paper-edge), 0 14px 26px rgba(60, 40, 10, 0.2); opacity: 0; white-space: nowrap; }
.tapenote { font-family: var(--hand); font-weight: 600; font-size: 44px; background: var(--tape); padding: 10px 22px; transform: rotate(-2deg); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.08); }

/* power tickets */
.power { width: 330px; height: 430px; background: var(--paper); border-radius: 12px; box-shadow: 0 4px 0 var(--paper-edge), 0 20px 34px rgba(60, 40, 10, 0.16); overflow: hidden; display: flex; flex-direction: column; }
.power .ph { background: var(--stamp); color: var(--paper); font-family: var(--mono); font-weight: 600; font-size: 17px; letter-spacing: 0.08em; text-transform: uppercase; padding: 12px 16px; }
.power .pi { font-size: 96px; color: var(--stamp); padding: 30px 0 10px; text-align: center; }
.power h5 { margin: 0; padding: 0 22px; font-family: var(--serif); font-weight: 400; font-size: 38px; line-height: 1.05; text-align: center; }
.power p { margin: 12px 0 0; padding: 0 24px; font-size: 22px; line-height: 1.3; color: var(--muted); text-align: center; }

/* postcard */
.postcard { width: 1240px; background: var(--paper); padding: 22px 22px 34px; box-shadow: 0 4px 0 var(--paper-edge), 0 34px 60px rgba(60, 40, 10, 0.28); transform: rotate(-1deg); }
.postcard .pic { height: 420px; overflow: hidden; position: relative; }
.postcard .pic svg { width: 100%; height: 100%; display: block; }
.postcard .greet { position: absolute; left: 22px; top: 18px; background: var(--paper); font-family: var(--serif); font-size: 30px; padding: 4px 14px; }
.postcard .kick { font-family: var(--mono); font-weight: 600; font-size: 22px; letter-spacing: 0.16em; color: var(--stamp); text-transform: uppercase; margin: 26px 10px 0; }
.postcard h1 { font-family: var(--serif); font-weight: 400; font-size: 140px; line-height: 1; margin: 6px 10px 0; }
.meter { display: flex; align-items: center; gap: 30px; background: var(--paper); padding: 30px 46px; border-radius: 8px; box-shadow: 0 4px 0 var(--paper-edge); font-family: var(--mono); font-weight: 600; font-size: 36px; letter-spacing: 0.1em; text-transform: uppercase; }
.meter .dot { width: 70px; height: 70px; border-radius: 50%; border: 5px solid #b8a98a; position: relative; }
.meter .dot i { position: absolute; inset: 6px; border-radius: 50%; background: var(--stamp); opacity: 0; }
.pass { width: 900px; background: var(--paper); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 0 var(--paper-edge), 0 20px 36px rgba(60, 40, 10, 0.2); }
.pass .hd { background: var(--ink-soft); color: var(--paper); display: flex; justify-content: space-between; padding: 12px 24px; font-family: var(--mono); font-weight: 600; font-size: 20px; letter-spacing: 0.12em; text-transform: uppercase; }
.pass .band { height: 120px; } .pass .band svg { width: 100%; height: 100%; display: block; }
.pass .route { display: flex; justify-content: space-between; align-items: end; padding: 20px 34px 26px; }
.pass .lab { font-family: var(--mono); font-size: 17px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; display: block; }
.pass .nm { font-family: var(--serif); font-size: 56px; line-height: 1; }
.tv { width: 900px; height: 506px; background: #181d2c; border-radius: 20px; padding: 16px; box-shadow: 0 30px 60px rgba(40, 25, 5, 0.35); }
.tv .scr { width: 100%; height: 100%; background: var(--kraft); border-radius: 8px; display: grid; grid-template-columns: 250px 1fr; gap: 20px; padding: 22px; }
.journal { background: var(--paper); padding: 16px 18px; }
.journal h6 { margin: 0 0 10px; font-family: var(--serif); font-weight: 400; font-size: 34px; border-bottom: 2px solid var(--ink); }
.journal div { font-family: var(--mono); font-size: 13px; line-height: 1.5; color: var(--muted); border-bottom: 1px dashed var(--rule); padding: 5px 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="assets.js"></script>
<script>
const I = (n, cls = '') => `<svg class="icon ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`
const stage = document.getElementById('stage')
const add = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); const el = d.firstChild; stage.appendChild(el); return el }
const $ = (sel, root = stage) => root.querySelector(sel)
const $$ = (sel, root = stage) => [...root.querySelectorAll(sel)]
const used = new WeakMap()
// Animate el from `a` to `b` starting at t seconds. The first animation on an element fills both ways; later ones
// only fill forwards, so they never override earlier states before they start.
function A(el, a, b, t, d = 0.6, easing = 'cubic-bezier(.2,.8,.3,1)') {
  if (!el) throw new Error('missing element at ' + t)
  const first = !used.get(el); used.set(el, true)
  el.animate([a, b], { delay: t * 1000, duration: d * 1000, fill: first ? 'both' : 'forwards', easing })
}
const show = (el, t0, t1, d = 0.5) => { A(el, { opacity: 0 }, { opacity: 1 }, t0, d); if (t1 !== undefined) A(el, { opacity: 1 }, { opacity: 0 }, t1 - d, d) }
const pop = (el, t, d = 0.5, from = 'scale(0.6)', to = 'scale(1)') => A(el, { opacity: 0, transform: from }, { opacity: 1, transform: to }, t, d, 'cubic-bezier(.2,1.4,.4,1)')
const slam = (el, t, rot = -6) => A(el, { opacity: 0, transform: `scale(2.2) rotate(${rot - 10}deg)` }, { opacity: 1, transform: `scale(1) rotate(${rot}deg)` }, t, 0.32, 'cubic-bezier(.3,1.5,.5,1)')
const dim = (el, t, to = 0.3) => A(el, { opacity: 1 }, { opacity: to }, t, 0.4)
const undim = (el, t, from = 0.3) => A(el, { opacity: from }, { opacity: 1 }, t, 0.4)
const scene = (t0, t1) => { const s = add('<div class="scene"></div>'); show(s, t0, t1); return s }
const into = (s, html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); const el = d.firstChild; s.appendChild(el); return el }

// ---------------------------------------------------------------- chapters and captions
const CH = [
  [6, 21, 1, 'The teams'], [21, 33, 2, 'Who knows what'], [33, 48, 3, 'How to win'], [48, 57, 4, 'Each round is a day'],
  [57, 69, 5, 'Pick a Day Planner'], [69, 81, 6, 'The vote'], [81, 93, 7, 'Indecision meter'], [93, 111, 8, 'The silent handoff'],
  [111, 121, 9, 'The deck'], [121, 146, 10, 'Powers'], [146, 156, 11, 'Watch the Chief'], [156, 165, 12, 'Phones and the TV'],
]
const CAP = [
  [6.6, 10, 'Everyone gets a secret role on their phone.'],
  [10, 15, 'Most of you are Chill Parents. You just want a breezy trip.'],
  [15, 20.6, 'But two Overschedulers and their boss, the Chief Overscheduler, want chaos.'],
  [21.4, 27, 'Overschedulers know each other, and they know who the Chief is.'],
  [27, 32.6, "The Chief doesn't know their teammates. Chill Parents know nothing at all."],
  [33.4, 38, 'Every day, one card gets played: a Breezy Day or an Overscheduled Day.'],
  [38, 43.5, 'Chill Parents win with 5 Breezy Days. Overschedulers win with 6 Overscheduled Days.'],
  [43.5, 47.6, 'Every card played is stamped on the board for everyone to see.'],
  [48.4, 53, 'Each round is a new day. Someone is the First One Awake.'],
  [53, 56.6, 'The job passes to the next person around the table every day.'],
  [57.4, 62, 'The First One Awake picks someone to be the Day Planner.'],
  [62, 68.6, "Whoever planned the last day sits this one out. They're sleeping in."],
  [69.4, 73, "Together they're today's planning committee. Everyone votes on it at once."],
  [73, 77, 'The stamps flip together. A majority of YES approves the committee.'],
  [77, 80.6, 'A tie, or a majority of NO, means the vote fails.'],
  [81.4, 85, 'Every failed vote moves the indecision meter up one.'],
  [85, 90, 'Three in a row and the babies decide: the top card is played automatically.'],
  [90, 92.6, 'Then the meter resets.'],
  [93.4, 98, 'If the vote passes, the First One Awake secretly draws three cards.'],
  [98, 102, 'They bin one and pass the other two to the Day Planner.'],
  [102, 106, 'The Day Planner plays one. No talking: the babies are asleep.'],
  [106, 110.6, "Then anyone can claim anything. That's where the lying starts."],
  [111.4, 116, 'The deck has 6 Breezy Days and 11 Overscheduled Days.'],
  [116, 120.6, "So even honest players get bad hands, and nobody can prove who's lying."],
  [121.4, 126, 'Overscheduled Days unlock powers for the First One Awake.'],
  [126, 131, "Read someone else's texts: secretly see one player's team."],
  [131, 136, 'Breakfast duty: choose who wakes up first tomorrow.'],
  [136, 141, 'Babysitter duty: that player stays back at the house and is out.'],
  [141, 145.6, 'After the fifth, the planning committee can agree to veto a bad hand.'],
  [146.4, 150, 'Careful: after 3 Overscheduled Days, if the Chief becomes Day Planner…'],
  [150, 153, '…the Overschedulers win instantly.'],
  [153, 155.6, 'But put the Chief on babysitter duty, and the Chill Parents win.'],
  [156.4, 160.5, 'Your phone is private: your role, your cards, your turn.'],
  [160.5, 164.6, 'The TV shows the board everyone can see. Keep your phone to yourself.'],
]
for (const [t0, t1, n, label] of CH) show(add(`<div class="chapter"><b>${String(n).padStart(2, '0')}</b>${label}</div>`), t0 + 0.2, t1 - 0.1)
for (const [t0, t1, text] of CAP) show(add(`<div class="caption">${text}</div>`), t0, t1, 0.35)

const NAMES = ['Sam', 'Priya', 'Jordan', 'Mia', 'Theo', 'Alex', 'Rosa', 'Kenji']
const bd = (k) => `<span class="bd" style="color:${k === 'B' ? '#2f5a3b' : '#b0302a'}">${k === 'B' ? SVGS.bdB : SVGS.bdO}</span>`

// ---------------------------------------------------------------- 0 title
{
  const s = scene(0, 6.2)
  const pc = into(s, `<div class="center" style="top:47%"><div class="postcard">
    <div class="pic">${SVGS.napa}<span class="greet">Greetings from Napa Valley</span></div>
    <div class="kick">How to play · Four couples, four babies, one trip to Napa</div>
    <h1>Wine or Whine</h1>
    <div class="row" style="justify-content:flex-start;gap:14px;margin:20px 10px 0" id="chips">
      <span class="chip paper">5–10 players</span><span class="chip paper">About 45 minutes</span><span class="chip paper">One phone each</span></div>
  </div></div>`)
  A(pc.firstChild, { transform: 'translateY(40px) rotate(-3deg)', opacity: 0 }, { transform: 'translateY(0) rotate(-1deg)', opacity: 1 }, 0.1, 0.9)
  $$('#chips .chip', s).forEach((c, i) => pop(c, 1.6 + i * 0.25))
}

// ---------------------------------------------------------------- 1 the teams
{
  const s = scene(6, 21)
  const roles = into(s, `<div class="center row" style="top:46%;gap:44px">
