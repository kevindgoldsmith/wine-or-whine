name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wine
          POSTGRES_PASSWORD: wine
          POSTGRES_DB: wine
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wine" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SIM_GAMES: "2000"
      TEST_DATABASE_URL: postgresql://wine:wine@localhost:5432/wine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: End-to-end on Postgres
        run: python -m pytest -q tests/test_e2e.py
        env:
          E2E_DATABASE_URL: postgresql://wine:wine@localhost:5432/wine
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wine-or-whine .
